exp_dir: /ecgvae/Models/TimeDiffusion/
local: false
projectconf:
  total_limit: 2
accelerator:
  gradient_accumulation_steps: 1
  mixed_precision: 'no'
  log_with: wandb
time: 12

defaults:
  - dataloader: batch128
  - train: normal50000
  - optimizer: adamw-lr4
  - loss: L2
  - lr_scheduler: cosine-w100
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: tpe
  - _self_


hydra:
  sweeper:
    sampler:
      seed: 123
    direction: maximize
    study_name: PTBXL
    storage: null
    n_trials: 15
    n_jobs: 1
    params:
      model-params-n_layers: choice(2,3,4,5)
      model-params-data_embed_dim: choice(64,128,256)
      model-params-num_heads: choice(4,8,16)
      model-params-patch_size: choice(8,16,32)
      model-params-dropout_rate: choice(0.3,0.5,0.7)

model-params-n_layers: 2
model-params-data_embed_dim: 64 
model-params-num_heads: 4
model-params-patch_size: 8
model-params-dropout_rate: 0.3